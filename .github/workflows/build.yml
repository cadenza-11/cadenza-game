name: Unity Build and Release

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: 'Run name'
        required: true
        default: 'Unity Build and Release'
        type: string
      create_release:
        description: 'Create a release after build'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      deploy_steam_main:
        description: 'Deploy to Steam main app'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      deploy_steam_demo:
        description: 'Deploy to Steam demo app'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

run-name: ${{ github.event.inputs.run_name }}

env:
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  REPO_NAME: ${{ github.event.repository.name }}
  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
  STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
  STEAM_APP_MAIN_ID: 4368070
  STEAM_APP_DEMO_ID: 4382010

jobs:
  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneOSX # Build a macOS standalone (Intel 64-bit).
          - StandaloneWindows64 # Build a Windows 64-bit standalone.
    steps:
      # Checkout
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      # Load SSH key
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}

      - name: Add GitHub to the SSH known hosts file
        run: |
          mkdir -p -m 0700 /home/runner/.ssh
          curl --silent https://api.github.com/meta | jq --raw-output '"github.com "+.ssh_keys[]' >> /home/runner/.ssh/known_hosts
          chmod 600 /home/runner/.ssh/known_hosts

      # Test SSH access
      - name: Test SSH access to assets repo
        run: |
          ssh -o StrictHostKeyChecking=accept-new -T git@github.com || true
          git ls-remote ssh://git@github.com/cadenza-11/private-assets.git

      # Git LFS
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v3
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      # Free disk space
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1

      # Cache Library folder
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      # Build
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
        with:
          sshAgent: ${{ env.SSH_AUTH_SOCK }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ matrix.targetPlatform }}
          buildsPath: build

      # Upload uncompressed builds
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  deployToSteamMain:
    name: Deploy to Steam Main
    needs: buildForAllSupportedPlatforms
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_steam_main == 'true'
    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deploy Windows build
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-StandaloneWindows64
          path: build/StandaloneWindows64

      # Deploy macOS build
      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-StandaloneOSX
          path: build/StandaloneOSX

      - uses: game-ci/steam-deploy@v3
        with:
          username: ${{ env.STEAM_USERNAME }}
          configVdf: ${{ env.STEAM_CONFIG_VDF }}
          appId: ${{ env.STEAM_APP_MAIN_ID }}
          buildDescription: (v${{ github.run_number }}) ${{ github.event.inputs.run_name }}
          rootPath: build
          depot1Path: StandaloneWindows64
          depot1InstallScriptPath: StandaloneWindows64/install_script.vdf
          depot2Path: StandaloneOSX
          depot2InstallScriptPath: StandaloneOSX/install_script.vdf
          releaseBranch: prerelease

  deployToSteamDemo:
    name: Deploy to Steam Demo
    needs: buildForAllSupportedPlatforms
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_steam_demo == 'true'
    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deploy Windows build
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-StandaloneWindows64
          path: build/StandaloneWindows64

      # Deploy macOS build
      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-StandaloneOSX
          path: build/StandaloneOSX

      - uses: game-ci/steam-deploy@v3
        with:
          username: ${{ env.STEAM_USERNAME }}
          configVdf: ${{ env.STEAM_CONFIG_VDF }}
          appId: ${{ env.STEAM_APP_DEMO_ID }}
          buildDescription: (v${{ github.run_number }}) ${{ github.event.inputs.run_name }}
          rootPath: build
          depot1Path: StandaloneWindows64
          depot1InstallScriptPath: StandaloneWindows64/install_script.vdf
          depot2Path: StandaloneOSX
          depot2InstallScriptPath: StandaloneOSX/install_script.vdf
          releaseBranch: prerelease

  release:
      permissions:
        contents: write
      needs: buildForAllSupportedPlatforms
      name: Create Github Release
      runs-on: ubuntu-latest
      if: github.event.inputs.create_release == 'true'
      steps:
        # Checkout for version info
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # Create Release
        - name: Create Release
          uses: actions/create-release@v1
          id: create_release
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            tag_name: v${{ github.run_number }}
            release_name: ${{ github.event.inputs.run_name }}
            body: |
              **Manual build triggered by:** ${{ github.actor }}
              **Build from commit:** ${{ github.sha }}
              **Build run:** #${{ github.run_number }}

            draft: false
            prerelease: false

        # Download Windows build
        - name: Download StandaloneWindows64 artifact
          uses: actions/download-artifact@v4
          with:
            name: ${{ env.REPO_NAME }}-StandaloneWindows64
            path: releases/${{ env.REPO_NAME }}-StandaloneWindows64

        # Compress Windows build
        - name: Compress Windows Build
          run: |
            cd releases/${{ env.REPO_NAME }}-StandaloneWindows64
            zip -r ../${{ env.REPO_NAME }}-Windows.zip .

        # Upload Windows build
        - name: Upload Windows Build
          uses: actions/upload-release-asset@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            asset_path: releases/${{ env.REPO_NAME }}-Windows.zip
            asset_name: ${{ env.REPO_NAME }}-Windows.zip
            asset_content_type: application/zip

        # Download macOS build
        - name: Download StandaloneOSX artifact
          uses: actions/download-artifact@v4
          with:
            name: ${{ env.REPO_NAME }}-StandaloneOSX
            path: releases/${{ env.REPO_NAME }}-StandaloneOSX

        # Compress macOS build
        - name: Compress macOS Build
          run: |
            cd releases/${{ env.REPO_NAME }}-StandaloneOSX
            tar -czf ../${{ env.REPO_NAME }}-macOS.tar.gz .

        # Upload macOS build
        - name: Upload macOS Build
          uses: actions/upload-release-asset@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            asset_path: releases/${{ env.REPO_NAME }}-macOS.tar.gz
            asset_name: ${{ env.REPO_NAME }}-macOS.tar.gz
            asset_content_type: application/gzip
