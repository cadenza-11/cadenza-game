name: Unity Build and Release

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: 'Run name'
        required: false
        default: 'Unity Build and Release'
        type: string
      create_release:
        description: 'Create a release after build'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      release_tag:
        description: 'Tag number (e.g. v.1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string
      release_name:
        description: 'Release name'
        required: true
        default: ''
        type: string
      release_description:
        description: 'Description of release'
        required: false
        default: ''
        type: string

run-name: ${{ github.event.inputs.run_name }}

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  REPO_NAME: ${{ github.event.repository.name }}
  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
  STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
  STEAM_APP_ID: 4382010

jobs:
  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneOSX # Build a macOS standalone (Intel 64-bit).
          - StandaloneWindows64 # Build a Windows 64-bit standalone.
    steps:
      # Checkout
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      # Git LFS
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v3
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      # Free disk space
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1

      # Cache Library folder
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      # Build
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ matrix.targetPlatform }}
          buildsPath: build
          versioning: Semantic

      # Upload uncompressed builds
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  deployToSteam:
    name: Deploy to Steam
    needs: buildForAllSupportedPlatforms
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deploy Windows build
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-StandaloneWindows64
          path: build/StandaloneWindows64
      - uses: game-ci/steam-deploy@v3
        with:
          username: ${{ env.STEAM_USERNAME }}
          configVdf: ${{ env.STEAM_CONFIG_VDF }}
          appId: ${{ env.STEAM_APP_ID }}
          buildDescription: ${{ github.event.inputs.release_description }}
          rootPath: build
          depot1Path: StandaloneWindows64
          depot1InstallScriptPath: StandaloneWindows64/install_script.vdf
          releaseBranch: default

  release:
      permissions:
        contents: write
      needs: buildForAllSupportedPlatforms
      name: Create Release
      runs-on: ubuntu-latest
      if: github.event.inputs.create_release == 'true'
      steps:
        # Checkout for version info
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # Download build archives
        - name: Download Archive Artifacts
          uses: actions/download-artifact@v4
          with:
            path: releases/
            merge-multiple: true

        # List downloaded files
        - name: List downloaded archives
          run: |
            echo "Downloaded release files:"
            ls -la releases/

        # Create Release
        - name: Create Release
          uses: actions/create-release@v1
          id: create_release
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            tag_name: ${{ github.event.inputs.release_tag }}
            release_name: ${{ github.event.inputs.release_name }}
            body: |
              ## ${{ github.event.inputs.release_name }}

              ${{ github.event.inputs.release_description }}

              **Manual build triggered by:** ${{ github.actor }}
              **Build from commit:** ${{ github.sha }}
              **Build run:** #${{ github.run_number }}

            draft: false
            prerelease: false

        # Compress Windows build
        - name: Compress Windows Build
          run: |
            cd releases/${{ env.REPO_NAME }}-StandaloneWindows64
            zip -r ../${{ env.REPO_NAME }}-Windows.zip .

        # Upload Windows build
        - name: Upload Windows Build
          uses: actions/upload-release-asset@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            asset_path: releases/${{ env.REPO_NAME }}-Windows.zip
            asset_name: ${{ env.REPO_NAME }}-Windows.zip
            asset_content_type: application/zip

        # Compress macOS build
        - name: Compress macOS Build
          run: |
            cd releases/${{ env.REPO_NAME }}-StandaloneOSX
            tar -czf ../${{ env.REPO_NAME }}-macOS.tar.gz .

        # Upload macOS build
        - name: Upload macOS Build
          uses: actions/upload-release-asset@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            asset_path: releases/${{ env.REPO_NAME }}-macOS.tar.gz
            asset_name: ${{ env.REPO_NAME }}-macOS.tar.gz
            asset_content_type: application/gzip
